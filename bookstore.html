<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Bookstore</title>
        <style>
            @media (max-width: 768px) {}
            body {background-color: rgb(221, 185, 221);}
            h1 {color: indigo; font-family: 'Courier New', Courier, monospace; text-align: center; font: bold}
            h2 {color: darkorchid; font-family: 'Courier New', Courier, monospace; text-align: center; font: bold}
            p {color: olive; font-family:'Courier New', Courier, monospace;}
            p1 {color: olive; font-family:'Courier New', Courier, monospace; font-weight: 900; font-size: large}
            p2 {color: midnightblue; font-family: 'Courier New', Courier, monospace;}
            .product-photos {
                display: flex;
                justify-content: space-between;
                justify-content: space-evenly;
                justify-content: space-around;
            }
        </style>
    </head>

    <body>
        <header>
            <h1> &lt;3 Welcome to the Bookstore :3</h1>
            <br/>
            <p1>Here you can buy books and more!</p1>
        </header>
        <article>
            <p>Check out the catalogue below:</p>
        </article>
        </br>
        <section>
            <h2>Offered products:</h2>
            <div class="product-photos">
                <img src="images/books.jpg" height="200" alt="Books">
                <img src="images/notebook.jpg" height="200" alt="Notebooks">
                <img src="images/postcards.jpg" height="200" alt="Postcards">
                <style>
                    img {border:darkslateblue; border-style: dashed}
                </style>
            </div>
            <div class="category-buttons">

            </div>
        </section>
        </br>
        <section>
            <h2>Top-selling books:</h2>
        </section>
    </body>
</html>
