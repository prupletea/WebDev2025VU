<!DOCTYPE html>
<html lang="en">
    <div class="newsletter">
                <h3>Subscribe to our newsletter!</h3>
                <form id="newsletter-form">
                    <!-- validate this -->
                    Enter your email here*:
                    <div class="email-field">
                        <input required="required" type="email" class="email-box"/>
                    </div>
                    <!-- display when email is valid -->
                    Choose your preference:
                    <select class="email-type">
                        <option>Weekly</option>
                        <option>Monthly</option>
                    </select>
                    <br/>
                    <!-- validate this -->
                    Enter your age: (optional)
                    <div class="age-field">
                        <input class="age-entry" type="number"/>
                    </div>
                    <!-- validate this -->
                    Enter your phone number: (optional)
                    <div class="phone-field">
                        <input type="tel"/>
                    </div>
                    <!-- display if phone is valid -->
                    <div class="call-consent">
                        <input type="button">I agree to occasional phone calls about current offers./>
                    </div>
                    <input type="submit">
                </form>
            </div>
</html>
